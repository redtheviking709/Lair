<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lair</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,100,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,100,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  }
  .glow {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,100,0.08), transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
    max-width: 640px;
  }
  .logo {
    font-size: clamp(4rem, 15vw, 9rem);
    font-weight: 800;
    letter-spacing: 0.15em;
    color: #00ff64;
    text-shadow:
      0 0 10px rgba(0,255,100,0.8),
      0 0 40px rgba(0,255,100,0.4),
      0 0 80px rgba(0,255,100,0.2);
    line-height: 1;
    margin-bottom: 1.5rem;
  }
  .sub {
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    color: #888;
    margin-bottom: 3rem;
    line-height: 1.6;
  }
  .form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 420px;
    margin: 0 auto;
  }
  input[type="email"] {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,255,100,0.3);
    color: #fff;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="email"]:focus {
    border-color: #00ff64;
    box-shadow: 0 0 20px rgba(0,255,100,0.15);
  }
  input[type="email"]::placeholder { color: #555; }
  button {
    background: linear-gradient(135deg, #00ff64, #00cc50);
    border: none;
    color: #050505;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,255,100,0.3);
  }
  .note {
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 0.1em;
  }
  .pulse {
    display: inline-block;
    width: 8px; height: 8px;
    background: #00ff64;
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,100,0.7); }
    50% { opacity: 0.5; box-shadow: 0 0 0 10px rgba(0,255,100,0); }
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="logo">LAIR</div>
    <p class="sub">The social hub for traders, streamers, and degens.<br>Live streams, feeds, and the crypto scene — all in one place.</p>
    <form class="form" action="https://formspree.io/f/xppwljbr" method="POST">
      <input type="email" name="email" placeholder="Enter your email" required>
      <input type="hidden" name="_subject" value="Lair waitlist">
      <button type="submit">Get Early Access</button>
    </form>
    <p class="note"><span class="pulse"></span>COMING SOON</p>
  </div>
</body>
</html>
